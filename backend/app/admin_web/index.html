<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>Lover-Matcher Admin</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 920px; margin: 24px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 20px; }
    h2 { font-size: 16px; margin-top: 28px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
    th { background: #f6f6f6; }
    .token-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
    input, select, button { font-size: 13px; padding: 4px 8px; }
    .ok { color: #060; }
    .err { color: #c00; }
    .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>Lover-Matcher Admin</h1>

  <div class="token-bar">
    <label>Admin Token：</label>
    <input id="token" type="password" placeholder="X-Admin-Token" style="width: 240px" />
    <button onclick="saveToken()">保存</button>
    <button onclick="loadAll()">重新加载</button>
    <span id="tokenStatus"></span>
  </div>

  <h2>默认 LLM Provider</h2>
  <div class="row">
    <span>当前：<b id="currentProvider">-</b></span>
    <select id="providerSelect"></select>
    <button onclick="switchProvider()">切换</button>
    <span id="switchStatus"></span>
  </div>

  <h2>候选池（matchee）</h2>
  <div id="candidates">加载中...</div>

  <h2>匹配记录</h2>
  <div id="matches">加载中...</div>

  <script>
    function token() { return localStorage.getItem("lm_admin_token") || ""; }
    function saveToken() {
      const t = document.getElementById("token").value;
      localStorage.setItem("lm_admin_token", t);
      document.getElementById("tokenStatus").innerHTML = '<span class="ok">已保存</span>';
      loadAll();
    }
    document.getElementById("token").value = token();

    async function api(path, opts = {}) {
      const headers = Object.assign({ "X-Admin-Token": token(), "Content-Type": "application/json" }, opts.headers || {});
      const r = await fetch(path, Object.assign({}, opts, { headers }));
      if (!r.ok) {
        const txt = await r.text();
        throw new Error(`${r.status}: ${txt}`);
      }
      return await r.json();
    }

    async function loadProviders() {
      try {
        const [list, cur] = await Promise.all([
          api("/admin/api/providers"),
          api("/admin/api/providers/current"),
        ]);
        document.getElementById("currentProvider").textContent = cur.data.name;
        const sel = document.getElementById("providerSelect");
        sel.innerHTML = "";
        list.data.forEach((p) => {
          const opt = document.createElement("option");
          opt.value = p.name;
          opt.textContent = `${p.name} (${p.model})`;
          if (p.name === cur.data.name) opt.selected = true;
          sel.appendChild(opt);
        });
      } catch (e) {
        document.getElementById("currentProvider").innerHTML = `<span class="err">${e.message}</span>`;
      }
    }

    async function switchProvider() {
      const name = document.getElementById("providerSelect").value;
      const status = document.getElementById("switchStatus");
      try {
        const r = await api("/admin/api/providers/current", { method: "PUT", body: JSON.stringify({ name }) });
        status.innerHTML = `<span class="ok">已切换为 ${r.data.name}</span>`;
        document.getElementById("currentProvider").textContent = r.data.name;
      } catch (e) {
        status.innerHTML = `<span class="err">${e.message}</span>`;
      }
    }

    async function loadCandidates() {
      try {
        const r = await api("/admin/api/candidates");
        const rows = r.data;
        if (!rows.length) {
          document.getElementById("candidates").textContent = "（暂无）";
          return;
        }
        let html = "<table><thead><tr><th>name</th><th>gender</th><th>openid</th><th>user_id</th></tr></thead><tbody>";
        rows.forEach((u) => {
          html += `<tr><td>${u.name || "-"}</td><td>${u.gender || "-"}</td><td>${u.openid}</td><td>${u.user_id}</td></tr>`;
        });
        html += "</tbody></table>";
        document.getElementById("candidates").innerHTML = html;
      } catch (e) {
        document.getElementById("candidates").innerHTML = `<span class="err">${e.message}</span>`;
      }
    }

    async function loadMatches() {
      try {
        const r = await api("/admin/api/matches");
        const rows = r.data;
        if (!rows.length) {
          document.getElementById("matches").textContent = "（暂无）";
          return;
        }
        let html = "<table><thead><tr><th>matchee</th><th>matcher</th><th>decision</th><th>created_at</th><th>decided_at</th></tr></thead><tbody>";
        rows.forEach((m) => {
          html += `<tr><td>${m.matchee_name}</td><td>${m.matcher_name}</td><td>${m.decision}</td><td>${m.created_at}</td><td>${m.decided_at || "-"}</td></tr>`;
        });
        html += "</tbody></table>";
        document.getElementById("matches").innerHTML = html;
      } catch (e) {
        document.getElementById("matches").innerHTML = `<span class="err">${e.message}</span>`;
      }
    }

    async function loadAll() {
      await Promise.all([loadProviders(), loadCandidates(), loadMatches()]);
    }
    loadAll();
  </script>
</body>
</html>
